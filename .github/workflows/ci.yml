name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
      - name: Compile check
        run: |
          python -m py_compile app.py analyzer.py sandbox.py runner.py llm_client.py stats_guard.py inference_engine.py report_export.py analysis_templates.py
      - name: Ruff
        run: |
          pip install ruff
          ruff check .
      - name: Sandbox tests
        run: python test_sandbox.py
      - name: Stats guard tests
        run: python -X utf8 test_stats_guard.py
      - name: Inference tests
        run: python -X utf8 test_inference.py
      - name: App tests (e2e)
        env:
          FLASK_SECRET: ci-secret
        run: python -X utf8 test_app.py
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict