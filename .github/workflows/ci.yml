name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: |
          python -m py_compile app.py analyzer.py sandbox.py runner.py llm_client.py
      - name: Ruff
        run: |
          pip install ruff
          ruff check .
      - name: Sandbox tests
        run: python test_sandbox.py
      - name: App tests
        env:
          FLASK_SECRET: ci-secret
        run: python test_app.py
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict
