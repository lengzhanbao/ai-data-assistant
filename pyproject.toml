[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-assistant"
version = "0.2.0"
description = "Research Methods Copilot: upload data, ask questions, get assumption-checked statistical analysis with effect sizes, Bayes factors, and reproducible reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lengzhanbao" }]
keywords = ["data-analysis", "llm", "ai", "pandas", "sql", "research-methods", "statistics", "bayesian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "flask>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "requests>=2.31",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pingouin>=0.5",
]

[project.scripts]
ai-data-assistant = "app:main"

[tool.setuptools]
py-modules = ["app", "analyzer", "sandbox", "runner", "llm_client", "stats_guard", "inference_engine", "report_export", "analysis_templates"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]