services:
  ai-data-assistant:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      HOST: 0.0.0.0
      PORT: "5000"
      COOKIE_SECURE: "0"
    volumes:
      - uploads:/app/uploads
      - charts:/app/charts
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0

volumes:
  uploads:
  charts:
