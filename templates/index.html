<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 数据分析助手</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --accent:#4f8cff; --text:#e6e8ec; --muted:#8b93a1; --ok:#3ecf8e; --danger:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
           background:var(--bg); color:var(--text); }
    .wrap { max-width:960px; margin:0 auto; padding:16px; }
    h1 { font-size:22px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
    .card { background:var(--card); border-radius:12px; padding:16px 18px; margin-bottom:16px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .stack { display:flex; gap:10px; flex-direction:column; }
    input[type=file] { color:var(--muted); }
    label.file-input { display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
    button { background:var(--accent); color:#fff; border:0; border-radius:8px;
             padding:9px 16px; cursor:pointer; font-size:14px; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button.secondary { background:#22262f; color:var(--text); }
    button.danger { background:var(--danger); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .meta { color:var(--muted); font-size:13px; margin-top:8px; }
    .tablewrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }
    th,td { border:1px solid #2a2e38; padding:6px 8px; text-align:left; }
    th { background:#22262f; color:var(--muted); }
    .chat { display:flex; gap:10px; margin-bottom:12px; }
    .chat.user { justify-content:flex-end; }
    .bubble { max-width:80%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.6; white-space:pre-wrap; }
    .chat.user .bubble { background:var(--accent); color:#fff; }
    .chat.bot .bubble { background:#23272f; }
    textarea { width:100%; background:#0d0f13; color:var(--text); border:1px solid #2a2e38;
               border-radius:8px; padding:10px; font-size:14px; resize:vertical; min-height:54px; }
    img.chart { max-width:100%; border-radius:8px; margin-top:10px; }
    code { background:#0d0f13; padding:2px 6px; border-radius:4px; font-size:12px; color:#9fd0ff; }
    .err { color:var(--danger); white-space:pre-wrap; font-size:13px; }
    .guard-card { background:#1a2a1a !important; border:1px solid #2a5a2a; font-size:13px; }
    .ok { color:var(--ok); }
    details { margin-top:8px; }
    summary { cursor:pointer; color:var(--muted); font-size:12px; }
    .dataset-list { display:flex; flex-direction:column; gap:8px; }
    .dataset-item { display:flex; align-items:center; gap:8px; padding:8px 10px;
                    border:1px solid #2a2e38; border-radius:8px; background:#181b22; }
    .dataset-item.active { border-color:var(--accent); background:rgba(79,140,255,0.12); }
    .dataset-item .name { flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dataset-item .meta { font-size:12px; color:var(--muted); }
    .empty { padding:16px; color:var(--muted); text-align:center; font-size:13px; }

    @media (max-width: 640px) {
      .wrap { padding:10px; }
      h1 { font-size:18px; }
      .bubble { max-width:95%; }
      .row { gap:8px; }
      button { padding:8px 12px; font-size:13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior:auto !important; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>AI 数据分析助手</h1>
  <div class="sub">上传 Excel / CSV → 用自然语言提问 → 自动生成 Pandas 代码并出图</div>
  <div id="llmBanner" role="status" aria-live="polite" style="display:none; background:#3a2c10; color:#ffd97a; border:1px solid #6b5416; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px;"></div>

  <div class="card">
    <div class="row">
      <label class="file-input" for="file">选择文件</label>
      <input type="file" id="file" accept=".csv,.xlsx,.xls" aria-label="选择 CSV / Excel 文件">
      <button id="uploadBtn" type="button">上传数据</button>
      <button id="insightBtn" type="button" class="secondary" disabled>🔍 自动洞察 / 异常下探</button>
    </div>
    <div class="meta" id="uploadMeta" aria-live="polite"></div>
    <div id="schemaBox"></div>
    <div id="templateBox" style="display:none;margin-top:12px;">
      <div style="font-size:12px;color:#8b93a1;margin-bottom:6px;">Recommended:</div>
      <div class="row" id="templateList"></div>
    </div>
  </div>

  <div class="card" id="datasetsCard" style="display:none">
    <div class="row" style="justify-content:space-between; align-items:center">
      <strong>数据集（<span id="datasetCount">0</span>）</strong>
      <span class="meta" id="activeDatasetName"></span>
    </div>
    <div class="dataset-list" id="datasetList" role="list" aria-label="已上传数据集列表"></div>
  </div>

  <div class="card" id="chatCard" style="display:none">
    <div id="chips" class="row" aria-label="示例问题" style="margin-bottom:10px"></div>
    <div id="chat" aria-live="polite"></div>
    <div class="row" style="margin-top:8px">
      <label class="visually-hidden" for="question" style="position:absolute;left:-9999px">问题输入</label>
      <textarea id="question" placeholder="例如：哪个视频完播率最高？各视频平均播放量多少？按发布日期画播放量趋势图"></textarea>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="askBtn" type="button">分析</button>
      <button id="exportNbBtn" type="button" class="secondary" style="font-size:12px;">Notebook导出</button>
      <button id="exportHtmlBtn" type="button" class="secondary" style="font-size:12px;">HTML报告</button>
      <span class="meta" id="askMeta" aria-live="polite"></span>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let busy = false;
let currentDatasets = [];

const EXAMPLES = [
  '哪个视频完播率最高？',
  '播放量最高的 5 个视频是哪些？',
  '按发布日期画播放量趋势图',
  '互动率和完播率的相关性如何？',
  '时长超过 1000 秒的视频平均播放量多少？',
  '哪个月的视频数量最多？',
];

async function health() {
  try {
    const r = await fetch('/health');
    const d = await r.json();
    if (!d.llm_ready) {
      const b = $('#llmBanner');
      b.style.display = 'block';
      b.textContent = '⚠️ ' + d.hint + '（当前演示将无法生成分析，配置后刷新即可）';
    }
  } catch(e) {}
}

function showMetaError(text) {
  const meta = $('#uploadMeta');
  meta.textContent = '';
  const span = document.createElement('span');
  span.className = 'err';
  span.textContent = text;
  meta.appendChild(span);
}

function renderSchema(columns, preview) {
  const box = $('#schemaBox');
  box.textContent = '';
  if (!columns || !columns.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '暂无数据预览';
    box.appendChild(empty);
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'tablewrap';
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  columns.forEach(c => {
    const th = document.createElement('th');
    const name = document.createElement('div');
    name.textContent = c.name;
    const sub = document.createElement('span');
    sub.style.color = '#8b93a1';
    sub.textContent = c.dtype;
    th.appendChild(name);
    th.appendChild(sub);
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  preview.forEach(row => {
    const tr = document.createElement('tr');
    columns.forEach(c => {
      const td = document.createElement('td');
      td.textContent = row[c.name] == null ? '' : String(row[c.name]);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  box.appendChild(wrap);
}

function renderDatasets(datasets) {
  currentDatasets = datasets;
  const card = $('#datasetsCard');
  const list = $('#datasetList');
  list.textContent = '';
  $('#datasetCount').textContent = datasets.length;
  if (!datasets.length) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  datasets.forEach(d => {
    const item = document.createElement('div');
    item.className = 'dataset-item' + (d.active ? ' active' : '');
    item.setAttribute('role', 'listitem');

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = d.name;
    item.appendChild(name);

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = `${d.rows}行×${d.cols}列`;
    item.appendChild(meta);

    if (!d.active) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'secondary';
      btn.textContent = '切换';
      btn.onclick = () => selectDataset(d.dataset_id);
      item.appendChild(btn);
    }

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'danger';
    del.textContent = '删除';
    del.onclick = () => deleteDataset(d.dataset_id, d.name);
    item.appendChild(del);

    list.appendChild(item);
  });
  const active = datasets.find(d => d.active);
  $('#activeDatasetName').textContent = active ? `当前：${active.name}` : '';
}

async function selectDataset(dataset_id, updateView = true) {
  const d = await safeFetchJson('/datasets/select', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dataset_id }),
  }, '切换数据集失败');
  if (d.error) {
    showMetaError(d.error);
    return d;
  }
  if (updateView) {
    $('#uploadMeta').textContent = `已切换：${d.rows} 行 × ${d.cols} 列`;
    renderSchema(d.columns || [], d.preview || []);
    $('#chatCard').style.display = 'block';
    $('#insightBtn').disabled = false;
  }
  await refreshDatasets(false);
  return d;
}

async function deleteDataset(dataset_id, name) {
  if (!confirm(`确认删除「${name}」？此操作不可撤销。`)) return;
  const r = await fetch(`/datasets/${encodeURIComponent(dataset_id)}`, { method: 'DELETE' });
  if (!r.ok) {
    showMetaError(`删除失败（HTTP ${r.status}）`);
    return;
  }
  const d = await refreshDatasets(false);
  const active = (d.datasets || []).find(item => item.active);
  if (active) {
    await selectDataset(active.dataset_id, true);
  } else {
    $('#datasetsCard').style.display = 'none';
    $('#chatCard').style.display = 'none';
    $('#insightBtn').disabled = true;
    $('#schemaBox').textContent = '';
  }
}

async function refreshDatasets(restoreActive = true) {
  const d = await safeFetchJson('/datasets', null, '获取数据集列表失败');
  if (d.error) {
    renderDatasets([]);
    return d;
  }
  renderDatasets(d.datasets || []);
  const active = (d.datasets || []).find(item => item.active);
  if (restoreActive && active && $('#chatCard').style.display === 'none') {
    const selected = await selectDataset(active.dataset_id, false);
    if (selected && !selected.error) {
      $('#uploadMeta').textContent = `已恢复：${selected.rows} 行 × ${selected.cols} 列`;
      renderSchema(selected.columns || [], selected.preview || []);
      $('#chatCard').style.display = 'block';
      $('#insightBtn').disabled = false;
    }
  }
  return d;
}

async function upload() {
  const f = $('#file').files[0];
  if (!f) { showMetaError('请先选择文件'); return; }
  const fd = new FormData(); fd.append('file', f);
  $('#uploadBtn').disabled = true;
  let d;
  try {
    const r = await fetch('/upload', {method:'POST', body:fd});
    if (!r.ok) {
      d = { error: `上传失败（HTTP ${r.status}）` };
    } else {
      d = await r.json();
    }
  } catch (err) {
    d = { error: '上传失败：网络或服务异常' };
  }
  $('#uploadBtn').disabled = false;
  if (d.error) {
    showMetaError(d.error);
    return;
  }
  $('#uploadMeta').textContent = `已加载：${d.rows} 行 × ${d.cols} 列`;
  renderSchema(d.columns, d.preview);
  $('#chatCard').style.display = 'block';
  $('#insightBtn').disabled = false;
  renderDatasets(d.datasets || []);
  renderChips();
}

function renderChips() {
  const box = $('#chips');
  box.textContent = '';
  EXAMPLES.forEach(e => {
    const b = document.createElement('button');
    b.className = 'chip secondary';
    b.type = 'button';
    b.dataset.q = e;
    b.style.cssText = 'background:#22262f;color:#9fd0ff;font-size:12px;padding:5px 10px;margin:2px 4px 2px 0';
    b.textContent = e;
    b.onclick = () => { $('#question').value = b.dataset.q; ask(); };
    box.appendChild(b);
  });
}

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'chat ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  div.appendChild(b);
  $('#chat').appendChild(div);
  div.scrollIntoView();
}

function addCodeBlock(label, code) {
  const det = document.createElement('details');
  const summary = document.createElement('summary');
  summary.textContent = label;
  det.appendChild(summary);
  const pre = document.createElement('pre');
  const codeEl = document.createElement('code');
  codeEl.textContent = code;
  pre.appendChild(codeEl);
  det.appendChild(pre);
  const box = document.createElement('div');
  box.className = 'chat bot';
  box.appendChild(det);
  $('#chat').appendChild(box);
}

async function safeFetchJson(url, options, fallback) {
  try {
    const r = await fetch(url, options);
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      return { error: body.error || `${fallback}（HTTP ${r.status}）` };
    }
    return body;
  } catch (err) {
    return { error: `${fallback}：网络或服务异常` };
  }
}

function addSqlButton(resultId) {
  if (!resultId) return;
  const box = document.createElement('div');
  box.className = 'chat bot';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'secondary';
  btn.textContent = '📋 翻译为 SQL';
  btn.style.cssText = 'margin-top:4px;font-size:12px;padding:6px 12px;';
  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = '翻译中…';
    const r = await safeFetchJson(`/ask/${encodeURIComponent(resultId)}/sql`, {}, 'SQL 翻译失败');
    btn.remove();
    if (r.error) { addBubble('bot', '⚠️ ' + r.error); return; }
    if (r.sql) addCodeBlock('等价 SQL', r.sql);
    else addBubble('bot', '(该分析暂无法翻译为等价 SQL)');
  };
  box.appendChild(btn);
  $('#chat').appendChild(box);
}

async function ask(question) {
  if (busy) return;
  const q = question || $('#question').value.trim();
  if (!q) return;
  busy = true; $('#askBtn').disabled = true; $('#insightBtn').disabled = true;
  addBubble('user', q);
  $('#askMeta').textContent = '分析中…';
  const d = await safeFetchJson('/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: q }),
  }, '分析失败');
  $('#askMeta').textContent = '';
  if (d.error) { addBubble('bot', '⚠️ ' + d.error); }
  else {
    addBubble('bot', d.result || '(无文字结论)');
    if (d.guard_summary) {
      const gDiv = document.createElement('div');
      gDiv.className = 'chat bot';
      const gCard = document.createElement('div');
      gCard.className = 'bubble guard-card';
      const label = document.createElement('strong');
      label.textContent = '方法学检查: ';
      const detail = document.createElement('span');
      detail.textContent = d.guard_summary;
      gCard.appendChild(label); gCard.appendChild(detail);
      if (d.methodology) {
        const methTitle = document.createElement('div');
        methTitle.style.cssText = 'margin-top:8px;font-weight:bold;color:#8f8;';
        methTitle.textContent = '方法论说明';
        const methBody = document.createElement('div');
        methBody.style.cssText = 'margin-top:4px;white-space:pre-wrap;';
        methBody.textContent = d.methodology;
        gCard.appendChild(methTitle); gCard.appendChild(methBody);
      }
      gDiv.appendChild(gCard); #chat.appendChild(gDiv); gDiv.scrollIntoView();
    }
    if (d.chart) {
      const img = document.createElement('img');
      img.className = 'chart'; img.src = d.chart;
      img.alt = '分析图表';
      const box = document.createElement('div'); box.className = 'chat bot';
      const b = document.createElement('div'); b.className = 'bubble'; b.appendChild(img);
      box.appendChild(b); $('#chat').appendChild(box); box.scrollIntoView();
    }
    if (d.code) {
      addCodeBlock('查看生成的 Pandas 代码', d.code);
      addSqlButton(d.result_id);
    }
  }
  busy = false; $('#askBtn').disabled = false; $('#insightBtn').disabled = false;
  if (!question) $('#question').value = '';
}

async function insight() {
  if (busy) return;
  busy = true; $('#askBtn').disabled = true; $('#insightBtn').disabled = true;
  addBubble('user', '🔍 自动洞察：数据总览 + 异常下探 + 运营建议');
  $('#askMeta').textContent = '洞察中…';
  const d = await safeFetchJson('/insights', { method: 'POST' }, '洞察失败');
  $('#askMeta').textContent = '';
  if (d.error) { addBubble('bot', '⚠️ ' + d.error); }
  else {
    addBubble('bot', d.result || '(无结论)');
    if (d.chart) {
      const img = document.createElement('img');
      img.className = 'chart'; img.src = d.chart;
      img.alt = '洞察图表';
      const box = document.createElement('div'); box.className = 'chat bot';
      const b = document.createElement('div'); b.className = 'bubble'; b.appendChild(img);
      box.appendChild(b); $('#chat').appendChild(box); box.scrollIntoView();
    }
    if (d.code) addCodeBlock('查看生成的 Pandas 代码', d.code);
  }
  busy = false; $('#askBtn').disabled = false; $('#insightBtn').disabled = false;
}

$('#uploadBtn').onclick = upload;
$('#askBtn').onclick = () => ask();
$('#insightBtn').onclick = insight;
$('#question').addEventListener('keydown', e => { if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) ask(); });
async function loadTemplates() {
  try {
    const r = await fetch('/templates'); const d = await r.json();
    const box = document.getElementById('templateList'); box.textContent='';
    if (!d.templates || !d.templates.length) { document.getElementById('templateBox').style.display='none'; return; }
    document.getElementById('templateBox').style.display='block';
    d.templates.forEach(t => {
      const btn = document.createElement('button'); btn.className='tpl-btn';
      btn.textContent = t.icon+' '+t.name; btn.title=t.description;
      box.appendChild(btn);
    });
  } catch(e) {}
}
loadTemplates();
refreshDatasets();
health();
document.getElementById('exportHtmlBtn').onclick=function(){window.open('/export/html','_blank')};
</script>
</body>
</html>
